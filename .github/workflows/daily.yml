name: Daily Random Word Video

on:
  workflow_dispatch: # Allow manual runs
  schedule:
    - cron: "0 12 * * *" # Daily at 12:00 UTC

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OAuth credentials
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          Path("client_secret.json").write_text(
              os.environ["GOOGLE_CLIENT_SECRET_JSON"],
              encoding="utf-8"
          )
          Path("token.json").write_text(
              os.environ["GOOGLE_TOKEN_JSON"],
              encoding="utf-8"
          )
          PY

      - name: Generate video
        run: python main.py

      - name: Upload video to YouTube
        run: python upload_video.py